<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0a">
  <title>Dump</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg: #0a0a0a;
      --surface: #161616;
      --surface2: #1e1e1e;
      --surface3: #252525;
      --border: #2a2a2a;
      --text: #e8e8e8;
      --text2: #888;
      --text3: #555;
      --accent: #6C5CE7;
      --accent-dim: rgba(108, 92, 231, 0.15);
      --task: #FF6B6B;
      --call: #4ECDC4;
      --idea: #FFE66D;
      --text-tag: #A29BFE;
      --thought: #666;
      --pin: #FF9F43;
      --done-bg: rgba(108, 92, 231, 0.08);
      --danger: #e74c3c;
      --success: #2ecc71;
      --radius: 14px;
      --radius-sm: 10px;
    }

    [data-theme="light"] {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --surface2: #f0f0f2;
      --surface3: #e8e8ea;
      --border: #ddd;
      --text: #1a1a1a;
      --text2: #666;
      --text3: #999;
      --thought: #999;
      --done-bg: rgba(108, 92, 231, 0.06);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding-bottom: env(safe-area-inset-bottom, 20px);
      overflow-x: hidden;
      transition: background 0.3s, color 0.3s;
    }

    /* ── Header ── */
    .header {
      padding: 56px 20px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-left h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .header-left .date {
      font-size: 13px;
      color: var(--text2);
      margin-top: 2px;
    }
    .header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--surface);
      color: var(--text2);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .icon-btn:active { transform: scale(0.9); }
    .icon-btn.active { color: var(--accent); background: var(--accent-dim); }

    /* ── Stats Bar ── */
    .stats-bar {
      display: none;
      padding: 0 16px 8px;
      gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .stats-bar::-webkit-scrollbar { display: none; }
    .stats-bar.show { display: flex; }
    .stat-card {
      background: var(--surface);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      min-width: 100px;
      flex-shrink: 0;
    }
    .stat-value {
      font-size: 22px;
      font-weight: 700;
    }
    .stat-label {
      font-size: 11px;
      color: var(--text2);
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .stat-value.streak { color: var(--pin); }

    /* ── Search ── */
    .search-wrap {
      padding: 0 16px 8px;
      display: none;
    }
    .search-wrap.show { display: block; }
    .search-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .search-box svg { color: var(--text2); flex-shrink: 0; }
    .search-input {
      background: none;
      border: none;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      width: 100%;
    }
    .search-input::placeholder { color: var(--text3); }
    .search-clear {
      background: none;
      border: none;
      color: var(--text2);
      font-size: 18px;
      cursor: pointer;
      display: none;
      padding: 0 2px;
    }
    .search-clear.show { display: block; }

    /* ── Capture Area ── */
    .capture {
      padding: 0 16px 12px;
    }
    .capture-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.2s;
    }
    .capture-box.focused { border-color: var(--accent); }
    .capture-input {
      background: none;
      border: none;
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
      resize: none;
      outline: none;
      min-height: 22px;
      max-height: 120px;
      line-height: 1.4;
    }
    .capture-input::placeholder { color: var(--text3); }

    .capture-extras {
      display: none;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .capture-extras.show { display: flex; }

    .due-btn {
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px dashed var(--border);
      background: none;
      color: var(--text2);
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }
    .due-btn.set { border-style: solid; border-color: var(--accent); color: var(--accent); }
    .due-input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .pin-btn {
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px dashed var(--border);
      background: none;
      color: var(--text2);
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .pin-btn.active { border-style: solid; border-color: var(--pin); color: var(--pin); }

    .capture-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tag-btn {
      padding: 5px 12px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: none;
      color: var(--text2);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    .tag-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
    .tag-btn[data-tag="task"].active { border-color: var(--task); color: var(--task); background: rgba(255,107,107,0.1); }
    .tag-btn[data-tag="call"].active { border-color: var(--call); color: var(--call); background: rgba(78,205,196,0.1); }
    .tag-btn[data-tag="idea"].active { border-color: var(--idea); color: var(--idea); background: rgba(255,230,109,0.1); }
    .tag-btn[data-tag="text"].active { border-color: var(--text-tag); color: var(--text-tag); background: rgba(162,155,254,0.1); }

    .capture-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .mic-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: var(--surface2);
      color: var(--text2);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .mic-btn.recording { background: var(--danger); color: white; animation: pulse 1s infinite; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    .send-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.1s, opacity 0.15s;
      opacity: 0.4;
    }
    .send-btn.ready { opacity: 1; }
    .send-btn:active { transform: scale(0.9); }

    /* ── Filter Tabs ── */
    .filters {
      display: flex;
      gap: 4px;
      padding: 4px 16px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .filter-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: none;
      background: var(--surface);
      color: var(--text2);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      font-family: inherit;
      transition: all 0.15s;
    }
    .filter-btn.active { background: var(--text); color: var(--bg); }
    .filter-count {
      font-size: 11px;
      opacity: 0.6;
      margin-left: 4px;
    }

    /* ── Items List ── */
    .list {
      padding: 8px 16px 120px;
    }
    .day-group { margin-bottom: 20px; }
    .day-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 12px 4px 8px;
    }

    /* ── Item ── */
    .item-wrap {
      position: relative;
      margin-bottom: 8px;
      overflow: hidden;
      border-radius: 12px;
    }
    .swipe-bg {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
      display: flex;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: white;
    }
    .swipe-bg-left {
      left: 0;
      background: var(--success);
      justify-content: flex-start;
      padding-left: 20px;
    }
    .swipe-bg-right {
      right: 0;
      background: var(--danger);
      justify-content: flex-end;
      padding-right: 20px;
    }

    .item {
      background: var(--surface);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      position: relative;
      z-index: 2;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s;
      touch-action: pan-y;
      cursor: grab;
    }
    .item.removing {
      transform: translateX(-120%);
      opacity: 0;
    }
    .item.completing {
      transform: translateX(120%);
      opacity: 0;
    }
    .item.pinned {
      border-left: 3px solid var(--pin);
    }
    .item.done {
      opacity: 0.6;
    }
    .item.dragging {
      opacity: 0.8;
      transform: scale(1.02);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      z-index: 100;
    }
    .item.drag-over {
      border-top: 2px solid var(--accent);
    }
    .item.overdue .item-due { color: var(--danger); }

    .item-check {
      background: none;
      border: 1.5px solid var(--border);
      width: 22px;
      height: 22px;
      border-radius: 6px;
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: transparent;
      font-size: 12px;
      transition: all 0.15s;
    }
    .item-check:active { transform: scale(0.85); }
    .item.done .item-check {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    .item.done .item-text {
      text-decoration: line-through;
      color: var(--text2);
    }

    .item-body { flex: 1; min-width: 0; }
    .item-top-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .item-text {
      font-size: 15px;
      line-height: 1.4;
      word-wrap: break-word;
      flex: 1;
    }
    .item-pin-icon {
      color: var(--pin);
      font-size: 12px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .item-meta {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 5px;
      flex-wrap: wrap;
    }
    .item-time {
      font-size: 12px;
      color: var(--text2);
    }
    .item-tag-badge {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      padding: 2px 7px;
      border-radius: 4px;
    }
    .item-tag-badge.task { color: var(--task); background: rgba(255,107,107,0.12); }
    .item-tag-badge.call { color: var(--call); background: rgba(78,205,196,0.12); }
    .item-tag-badge.idea { color: var(--idea); background: rgba(255,230,109,0.12); }
    .item-tag-badge.text { color: var(--text-tag); background: rgba(162,155,254,0.12); }
    .item-due {
      font-size: 11px;
      color: var(--text2);
      display: flex;
      align-items: center;
      gap: 3px;
    }

    /* ── Subtasks ── */
    .subtasks {
      margin-top: 8px;
      padding-left: 4px;
    }
    .subtask {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
    }
    .subtask-check {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1.5px solid var(--border);
      background: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: transparent;
      font-size: 10px;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .subtask.done .subtask-check {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    .subtask-text {
      font-size: 13px;
      color: var(--text2);
    }
    .subtask.done .subtask-text {
      text-decoration: line-through;
      opacity: 0.5;
    }
    .subtask-delete {
      background: none;
      border: none;
      color: var(--text3);
      font-size: 14px;
      cursor: pointer;
      padding: 0 4px;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .subtask:hover .subtask-delete,
    .subtask:active .subtask-delete { opacity: 0.6; }
    @media (hover: none) { .subtask-delete { opacity: 0.4; } }

    .add-subtask {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 0;
      margin-top: 2px;
    }
    .add-subtask-input {
      background: none;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      padding: 2px 0;
      width: 100%;
    }
    .add-subtask-input::placeholder { color: var(--text3); }
    .subtask-progress {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      margin-top: 6px;
      overflow: hidden;
    }
    .subtask-progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.3s;
    }

    /* ── Item actions row ── */
    .item-actions {
      display: none;
      gap: 4px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .item-actions.show { display: flex; }
    .item-action-btn {
      padding: 4px 10px;
      border-radius: 6px;
      border: none;
      background: var(--surface2);
      color: var(--text2);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .item-action-btn:active { transform: scale(0.95); }
    .item-action-btn.danger { color: var(--danger); }

    /* ── Edit Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 500px;
      max-height: 80dvh;
      padding: 20px;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 600;
    }
    .modal-close {
      background: none;
      border: none;
      color: var(--text2);
      font-size: 24px;
      cursor: pointer;
      padding: 4px;
    }
    .modal-field {
      margin-bottom: 16px;
    }
    .modal-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 6px;
    }
    .modal-textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      resize: none;
      outline: none;
      min-height: 80px;
    }
    .modal-date-input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      width: 100%;
      color-scheme: dark;
    }
    [data-theme="light"] .modal-date-input { color-scheme: light; }
    .modal-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .modal-tag {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: none;
      color: var(--text2);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .modal-tag.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
    .modal-tag[data-tag="task"].active { border-color: var(--task); color: var(--task); }
    .modal-tag[data-tag="call"].active { border-color: var(--call); color: var(--call); }
    .modal-tag[data-tag="idea"].active { border-color: var(--idea); color: var(--idea); }
    .modal-tag[data-tag="text"].active { border-color: var(--text-tag); color: var(--text-tag); }
    .modal-save {
      width: 100%;
      padding: 14px;
      border-radius: var(--radius);
      border: none;
      background: var(--accent);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      margin-top: 8px;
      transition: transform 0.1s;
    }
    .modal-save:active { transform: scale(0.98); }

    /* ── Export Modal ── */
    .export-options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .export-btn {
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.15s;
    }
    .export-btn:active { transform: scale(0.98); }
    .export-btn .export-icon { font-size: 20px; width: 28px; text-align: center; }
    .export-btn .export-label { font-size: 12px; color: var(--text2); margin-top: 2px; }

    /* ── Empty State ── */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text2);
    }
    .empty-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.3; }
    .empty-text { font-size: 15px; line-height: 1.5; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--text);
      color: var(--bg);
      padding: 10px 20px;
      border-radius: 25px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 300;
      pointer-events: none;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (hover: none) {
      .subtask-delete { opacity: 0.3; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <h1>Dump</h1>
      <div class="date" id="headerDate"></div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="searchToggle" aria-label="Search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <button class="icon-btn" id="statsToggle" aria-label="Stats">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      </button>
      <button class="icon-btn" id="exportToggle" aria-label="Export">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button class="icon-btn" id="themeToggle" aria-label="Theme">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-bar" id="statsBar">
    <div class="stat-card"><div class="stat-value" id="statOpen">0</div><div class="stat-label">Open</div></div>
    <div class="stat-card"><div class="stat-value" id="statDone">0</div><div class="stat-label">Done</div></div>
    <div class="stat-card"><div class="stat-value" id="statWeek">0</div><div class="stat-label">This Week</div></div>
    <div class="stat-card"><div class="stat-value streak" id="statStreak">0</div><div class="stat-label">Day Streak</div></div>
  </div>

  <!-- Search -->
  <div class="search-wrap" id="searchWrap">
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" id="searchInput" type="text" placeholder="Search dumps...">
      <button class="search-clear" id="searchClear">&times;</button>
    </div>
  </div>

  <!-- Capture -->
  <div class="capture">
    <div class="capture-box" id="captureBox">
      <textarea class="capture-input" id="input" placeholder="What's on your mind?" rows="1"></textarea>
      <div class="capture-extras" id="captureExtras">
        <button class="due-btn" id="dueBtn">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span id="dueBtnText">Due date</span>
        </button>
        <input type="date" class="due-input" id="dueInput">
        <button class="pin-btn" id="pinBtn">Pin</button>
      </div>
      <div class="capture-bottom">
        <div class="tags">
          <button class="tag-btn" data-tag="task">Task</button>
          <button class="tag-btn" data-tag="call">Call</button>
          <button class="tag-btn" data-tag="idea">Idea</button>
          <button class="tag-btn" data-tag="text">Text</button>
        </div>
        <div class="capture-actions">
          <button class="mic-btn" id="micBtn" aria-label="Voice input">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M19 10v1a7 7 0 01-14 0v-1"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          </button>
          <button class="send-btn" id="sendBtn" aria-label="Save">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"></line>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Filters -->
  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="task">Tasks</button>
    <button class="filter-btn" data-filter="call">Calls</button>
    <button class="filter-btn" data-filter="idea">Ideas</button>
    <button class="filter-btn" data-filter="text">Texts</button>
    <button class="filter-btn" data-filter="thought">Thoughts</button>
    <button class="filter-btn" data-filter="done">Done</button>
  </div>

  <!-- List -->
  <div class="list" id="list"></div>

  <!-- Edit Modal -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Edit</span>
        <button class="modal-close" id="editClose">&times;</button>
      </div>
      <div class="modal-field">
        <div class="modal-label">Content</div>
        <textarea class="modal-textarea" id="editText"></textarea>
      </div>
      <div class="modal-field">
        <div class="modal-label">Tag</div>
        <div class="modal-tags" id="editTags">
          <button class="modal-tag" data-tag="thought">Thought</button>
          <button class="modal-tag" data-tag="task">Task</button>
          <button class="modal-tag" data-tag="call">Call</button>
          <button class="modal-tag" data-tag="idea">Idea</button>
          <button class="modal-tag" data-tag="text">Text</button>
        </div>
      </div>
      <div class="modal-field">
        <div class="modal-label">Due Date</div>
        <input type="date" class="modal-date-input" id="editDue">
      </div>
      <button class="modal-save" id="editSave">Save Changes</button>
    </div>
  </div>

  <!-- Export Modal -->
  <div class="modal-overlay" id="exportModal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Export & Backup</span>
        <button class="modal-close" id="exportClose">&times;</button>
      </div>
      <div class="export-options">
        <button class="export-btn" id="exportJSON">
          <span class="export-icon">{}</span>
          <div><div>JSON Backup</div><div class="export-label">Full data, reimportable</div></div>
        </button>
        <button class="export-btn" id="exportText">
          <span class="export-icon">T</span>
          <div><div>Plain Text</div><div class="export-label">Human readable, grouped by day</div></div>
        </button>
        <button class="export-btn" id="exportCSV">
          <span class="export-icon">,</span>
          <div><div>CSV Spreadsheet</div><div class="export-label">Open in Excel or Google Sheets</div></div>
        </button>
        <button class="export-btn" id="importJSON">
          <span class="export-icon">+</span>
          <div><div>Import JSON Backup</div><div class="export-label">Restore from a previous export</div></div>
        </button>
      </div>
      <input type="file" id="importFile" accept=".json" style="display:none">
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ═══════════════════════════════
    //  DATA LAYER
    // ═══════════════════════════════
    const STORAGE_KEY = 'braindump_items';
    const THEME_KEY = 'braindump_theme';

    function getItems() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
      catch { return []; }
    }
    function saveItems(items) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    // ═══════════════════════════════
    //  STATE
    // ═══════════════════════════════
    let activeTag = null;
    let activeFilter = 'all';
    let searchQuery = '';
    let editingId = null;
    let capturePinned = false;
    let captureDue = '';
    let expandedItems = new Set();

    // ═══════════════════════════════
    //  ELEMENTS
    // ═══════════════════════════════
    const $ = id => document.getElementById(id);
    const input = $('input');
    const sendBtn = $('sendBtn');
    const listEl = $('list');
    const toastEl = $('toast');
    const captureBox = $('captureBox');
    const captureExtras = $('captureExtras');
    const searchWrap = $('searchWrap');
    const searchInput = $('searchInput');
    const searchClear = $('searchClear');
    const statsBar = $('statsBar');
    const dueBtn = $('dueBtn');
    const dueBtnText = $('dueBtnText');
    const dueInput = $('dueInput');
    const pinBtn = $('pinBtn');
    const micBtn = $('micBtn');

    // ═══════════════════════════════
    //  THEME
    // ═══════════════════════════════
    function initTheme() {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved) document.documentElement.setAttribute('data-theme', saved);
    }
    initTheme();

    $('themeToggle').addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next === 'dark' ? '' : next);
      localStorage.setItem(THEME_KEY, next);
      if (next === 'dark') document.documentElement.removeAttribute('data-theme');
      haptic();
    });

    // ═══════════════════════════════
    //  HEADER DATE
    // ═══════════════════════════════
    $('headerDate').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });

    // ═══════════════════════════════
    //  HAPTIC FEEDBACK
    // ═══════════════════════════════
    function haptic(style = 'light') {
      if (navigator.vibrate) {
        navigator.vibrate(style === 'heavy' ? 30 : style === 'medium' ? 15 : 8);
      }
    }

    // ═══════════════════════════════
    //  CAPTURE INPUT
    // ═══════════════════════════════
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
      const hasText = input.value.trim().length > 0;
      sendBtn.classList.toggle('ready', hasText);
      captureExtras.classList.toggle('show', hasText);
    });
    input.addEventListener('focus', () => captureBox.classList.add('focused'));
    input.addEventListener('blur', () => captureBox.classList.remove('focused'));

    // Tags
    document.querySelectorAll('.capture .tag-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const tag = btn.dataset.tag;
        if (activeTag === tag) {
          activeTag = null;
          btn.classList.remove('active');
        } else {
          document.querySelectorAll('.capture .tag-btn').forEach(b => b.classList.remove('active'));
          activeTag = tag;
          btn.classList.add('active');
        }
        haptic();
        input.focus();
      });
    });

    // Due date
    dueBtn.addEventListener('click', () => dueInput.showPicker?.() || dueInput.click());
    dueInput.addEventListener('change', () => {
      captureDue = dueInput.value;
      if (captureDue) {
        dueBtnText.textContent = formatDueShort(captureDue);
        dueBtn.classList.add('set');
      } else {
        dueBtnText.textContent = 'Due date';
        dueBtn.classList.remove('set');
      }
    });

    // Pin
    pinBtn.addEventListener('click', () => {
      capturePinned = !capturePinned;
      pinBtn.classList.toggle('active', capturePinned);
      haptic();
    });

    // Filters
    $('filters').addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      haptic();
      renderList();
    });

    // ═══════════════════════════════
    //  SEARCH
    // ═══════════════════════════════
    $('searchToggle').addEventListener('click', () => {
      const showing = searchWrap.classList.toggle('show');
      $('searchToggle').classList.toggle('active', showing);
      if (showing) searchInput.focus();
      else { searchInput.value = ''; searchQuery = ''; searchClear.classList.remove('show'); renderList(); }
      haptic();
    });
    searchInput.addEventListener('input', () => {
      searchQuery = searchInput.value.toLowerCase().trim();
      searchClear.classList.toggle('show', searchQuery.length > 0);
      renderList();
    });
    searchClear.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      searchClear.classList.remove('show');
      renderList();
      searchInput.focus();
    });

    // ═══════════════════════════════
    //  STATS
    // ═══════════════════════════════
    $('statsToggle').addEventListener('click', () => {
      const showing = statsBar.classList.toggle('show');
      $('statsToggle').classList.toggle('active', showing);
      if (showing) updateStats();
      haptic();
    });

    function updateStats() {
      const items = getItems();
      const now = new Date();
      const weekAgo = new Date(now); weekAgo.setDate(weekAgo.getDate() - 7);

      $('statOpen').textContent = items.filter(i => !i.done).length;
      $('statDone').textContent = items.filter(i => i.done).length;
      $('statWeek').textContent = items.filter(i => new Date(i.time) >= weekAgo).length;
      $('statStreak').textContent = calcStreak(items);
    }

    function calcStreak(items) {
      if (!items.length) return 0;
      const days = new Set(items.map(i => new Date(i.time).toISOString().split('T')[0]));
      let streak = 0;
      let d = new Date();
      // check if today has items, if not start from yesterday
      if (!days.has(d.toISOString().split('T')[0])) {
        d.setDate(d.getDate() - 1);
      }
      while (days.has(d.toISOString().split('T')[0])) {
        streak++;
        d.setDate(d.getDate() - 1);
      }
      return streak;
    }

    // ═══════════════════════════════
    //  VOICE INPUT
    // ═══════════════════════════════
    let recognition = null;
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      let isRecording = false;

      micBtn.addEventListener('click', () => {
        if (isRecording) {
          recognition.stop();
          return;
        }
        recognition.start();
        isRecording = true;
        micBtn.classList.add('recording');
        haptic('medium');
      });

      recognition.onresult = (e) => {
        let transcript = '';
        for (let i = 0; i < e.results.length; i++) {
          transcript += e.results[i][0].transcript;
        }
        input.value = transcript;
        input.dispatchEvent(new Event('input'));
      };

      recognition.onend = () => {
        isRecording = false;
        micBtn.classList.remove('recording');
      };

      recognition.onerror = () => {
        isRecording = false;
        micBtn.classList.remove('recording');
        showToast('Mic access denied');
      };
    } else {
      micBtn.style.display = 'none';
    }

    // ═══════════════════════════════
    //  ADD ITEM
    // ═══════════════════════════════
    function addItem() {
      const text = input.value.trim();
      if (!text) return;

      const item = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        text,
        tag: activeTag || 'thought',
        time: new Date().toISOString(),
        done: false,
        pinned: capturePinned,
        due: captureDue || null,
        subtasks: [],
      };

      const items = getItems();
      items.unshift(item);
      saveItems(items);

      // Reset
      input.value = '';
      input.style.height = 'auto';
      sendBtn.classList.remove('ready');
      activeTag = null;
      capturePinned = false;
      captureDue = '';
      document.querySelectorAll('.capture .tag-btn').forEach(b => b.classList.remove('active'));
      pinBtn.classList.remove('active');
      dueBtn.classList.remove('set');
      dueBtnText.textContent = 'Due date';
      dueInput.value = '';
      captureExtras.classList.remove('show');

      haptic('medium');
      renderList();
      updateStats();
      showToast('Captured');
      input.focus();
    }

    sendBtn.addEventListener('click', addItem);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addItem(); }
    });

    // ═══════════════════════════════
    //  ITEM ACTIONS
    // ═══════════════════════════════
    function toggleDone(id) {
      const items = getItems();
      const item = items.find(i => i.id === id);
      if (item) {
        item.done = !item.done;
        saveItems(items);
        haptic('medium');
        renderList();
        updateStats();
      }
    }

    function deleteItem(id) {
      const wrap = document.querySelector(`[data-wrap="${id}"]`);
      if (wrap) {
        const el = wrap.querySelector('.item');
        el.classList.add('removing');
        setTimeout(() => {
          const items = getItems().filter(i => i.id !== id);
          saveItems(items);
          haptic();
          renderList();
          updateStats();
        }, 250);
      }
    }

    function togglePin(id) {
      const items = getItems();
      const item = items.find(i => i.id === id);
      if (item) {
        item.pinned = !item.pinned;
        saveItems(items);
        haptic('medium');
        renderList();
        showToast(item.pinned ? 'Pinned' : 'Unpinned');
      }
    }

    function toggleExpand(id) {
      if (expandedItems.has(id)) expandedItems.delete(id);
      else expandedItems.add(id);
      haptic();
      renderList();
    }

    // ═══════════════════════════════
    //  EDIT MODAL
    // ═══════════════════════════════
    function openEdit(id) {
      const items = getItems();
      const item = items.find(i => i.id === id);
      if (!item) return;
      editingId = id;
      $('editText').value = item.text;
      $('editDue').value = item.due || '';
      document.querySelectorAll('#editTags .modal-tag').forEach(b => {
        b.classList.toggle('active', b.dataset.tag === item.tag);
      });
      $('editModal').classList.add('show');
      haptic();
    }

    $('editClose').addEventListener('click', () => { $('editModal').classList.remove('show'); editingId = null; });
    $('editModal').addEventListener('click', (e) => { if (e.target === $('editModal')) { $('editModal').classList.remove('show'); editingId = null; } });

    document.querySelectorAll('#editTags .modal-tag').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#editTags .modal-tag').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        haptic();
      });
    });

    $('editSave').addEventListener('click', () => {
      if (!editingId) return;
      const items = getItems();
      const item = items.find(i => i.id === editingId);
      if (item) {
        item.text = $('editText').value.trim() || item.text;
        item.due = $('editDue').value || null;
        const activeTagEl = document.querySelector('#editTags .modal-tag.active');
        if (activeTagEl) item.tag = activeTagEl.dataset.tag;
        saveItems(items);
        haptic('medium');
        renderList();
        showToast('Updated');
      }
      $('editModal').classList.remove('show');
      editingId = null;
    });

    // ═══════════════════════════════
    //  SUBTASKS
    // ═══════════════════════════════
    function addSubtask(itemId, text) {
      if (!text.trim()) return;
      const items = getItems();
      const item = items.find(i => i.id === itemId);
      if (item) {
        if (!item.subtasks) item.subtasks = [];
        item.subtasks.push({
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 4),
          text: text.trim(),
          done: false,
        });
        saveItems(items);
        haptic();
        renderList();
      }
    }

    function toggleSubtask(itemId, subId) {
      const items = getItems();
      const item = items.find(i => i.id === itemId);
      if (item && item.subtasks) {
        const sub = item.subtasks.find(s => s.id === subId);
        if (sub) {
          sub.done = !sub.done;
          saveItems(items);
          haptic();
          renderList();
        }
      }
    }

    function deleteSubtask(itemId, subId) {
      const items = getItems();
      const item = items.find(i => i.id === itemId);
      if (item && item.subtasks) {
        item.subtasks = item.subtasks.filter(s => s.id !== subId);
        saveItems(items);
        haptic();
        renderList();
      }
    }

    // ═══════════════════════════════
    //  SWIPE GESTURES
    // ═══════════════════════════════
    let swipeState = null;

    function initSwipe(el, id) {
      let startX, startY, currentX, swiping = false, locked = false;

      el.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        currentX = 0;
        swiping = false;
        locked = false;
      }, { passive: true });

      el.addEventListener('touchmove', (e) => {
        if (locked) return;
        const dx = e.touches[0].clientX - startX;
        const dy = e.touches[0].clientY - startY;

        if (!swiping && Math.abs(dy) > Math.abs(dx)) { locked = true; return; }
        if (Math.abs(dx) > 10) swiping = true;
        if (!swiping) return;

        currentX = dx;
        el.style.transform = `translateX(${dx}px)`;
        el.style.transition = 'none';
      }, { passive: true });

      el.addEventListener('touchend', () => {
        if (!swiping) return;
        el.style.transition = 'transform 0.25s cubic-bezier(0.16,1,0.3,1), opacity 0.2s';

        if (currentX > 80) {
          // Swipe right → done
          el.classList.add('completing');
          haptic('heavy');
          setTimeout(() => toggleDone(id), 250);
        } else if (currentX < -80) {
          // Swipe left → delete
          el.classList.add('removing');
          haptic('heavy');
          setTimeout(() => {
            const items = getItems().filter(i => i.id !== id);
            saveItems(items);
            renderList();
            updateStats();
          }, 250);
        } else {
          el.style.transform = 'translateX(0)';
        }
      });
    }

    // ═══════════════════════════════
    //  DRAG TO REORDER
    // ═══════════════════════════════
    let dragId = null;

    function initDrag(el, id) {
      let longPressTimer, isDragging = false;

      el.addEventListener('touchstart', (e) => {
        longPressTimer = setTimeout(() => {
          isDragging = true;
          dragId = id;
          el.classList.add('dragging');
          haptic('heavy');
        }, 500);
      }, { passive: true });

      el.addEventListener('touchmove', () => {
        if (!isDragging) clearTimeout(longPressTimer);
      }, { passive: true });

      el.addEventListener('touchend', () => {
        clearTimeout(longPressTimer);
        if (isDragging) {
          isDragging = false;
          el.classList.remove('dragging');
          // find drop target
          const allItems = document.querySelectorAll('.item.drag-over');
          allItems.forEach(i => i.classList.remove('drag-over'));
          dragId = null;
          renderList();
        }
      });
    }

    // ═══════════════════════════════
    //  EXPORT / IMPORT
    // ═══════════════════════════════
    $('exportToggle').addEventListener('click', () => { $('exportModal').classList.add('show'); haptic(); });
    $('exportClose').addEventListener('click', () => $('exportModal').classList.remove('show'));
    $('exportModal').addEventListener('click', (e) => { if (e.target === $('exportModal')) $('exportModal').classList.remove('show'); });

    $('exportJSON').addEventListener('click', () => {
      download('braindump-backup.json', JSON.stringify(getItems(), null, 2), 'application/json');
      showToast('JSON exported');
      $('exportModal').classList.remove('show');
    });

    $('exportText').addEventListener('click', () => {
      const items = getItems();
      const groups = {};
      items.forEach(item => {
        const d = new Date(item.time).toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        if (!groups[d]) groups[d] = [];
        groups[d].push(item);
      });
      let text = 'BRAIN DUMP EXPORT\n==================\n\n';
      Object.entries(groups).forEach(([day, dayItems]) => {
        text += `--- ${day} ---\n`;
        dayItems.forEach(i => {
          const time = new Date(i.time).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
          const tag = i.tag !== 'thought' ? `[${i.tag}] ` : '';
          const done = i.done ? '[DONE] ' : '';
          const pin = i.pinned ? '[PIN] ' : '';
          text += `  ${time}  ${pin}${done}${tag}${i.text}\n`;
          if (i.subtasks?.length) {
            i.subtasks.forEach(s => { text += `    ${s.done ? '[x]' : '[ ]'} ${s.text}\n`; });
          }
        });
        text += '\n';
      });
      download('braindump.txt', text, 'text/plain');
      showToast('Text exported');
      $('exportModal').classList.remove('show');
    });

    $('exportCSV').addEventListener('click', () => {
      const items = getItems();
      let csv = 'Time,Tag,Text,Done,Pinned,Due\n';
      items.forEach(i => {
        csv += `"${i.time}","${i.tag}","${i.text.replace(/"/g, '""')}",${i.done},${i.pinned || false},"${i.due || ''}"\n`;
      });
      download('braindump.csv', csv, 'text/csv');
      showToast('CSV exported');
      $('exportModal').classList.remove('show');
    });

    $('importJSON').addEventListener('click', () => $('importFile').click());
    $('importFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const imported = JSON.parse(ev.target.result);
          if (!Array.isArray(imported)) throw new Error();
          const existing = getItems();
          const existingIds = new Set(existing.map(i => i.id));
          const newItems = imported.filter(i => !existingIds.has(i.id));
          saveItems([...newItems, ...existing]);
          renderList();
          updateStats();
          showToast(`Imported ${newItems.length} items`);
        } catch {
          showToast('Invalid backup file');
        }
      };
      reader.readAsText(file);
      $('exportModal').classList.remove('show');
      e.target.value = '';
    });

    function download(filename, content, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    // ═══════════════════════════════
    //  HELPERS
    // ═══════════════════════════════
    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    function formatDueShort(dateStr) {
      const d = new Date(dateStr + 'T12:00:00');
      const today = new Date(); today.setHours(0,0,0,0);
      const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate() + 1);
      const target = new Date(d); target.setHours(0,0,0,0);

      if (target.getTime() === today.getTime()) return 'Today';
      if (target.getTime() === tomorrow.getTime()) return 'Tomorrow';
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function isOverdue(dateStr) {
      if (!dateStr) return false;
      const today = new Date(); today.setHours(0,0,0,0);
      const due = new Date(dateStr + 'T12:00:00'); due.setHours(0,0,0,0);
      return due < today;
    }

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 1500);
    }

    // ═══════════════════════════════
    //  RENDER
    // ═══════════════════════════════
    function renderList() {
      const items = getItems();
      let filtered;

      if (activeFilter === 'all') filtered = items.filter(i => !i.done);
      else if (activeFilter === 'done') filtered = items.filter(i => i.done);
      else filtered = items.filter(i => i.tag === activeFilter && !i.done);

      // Search
      if (searchQuery) {
        filtered = filtered.filter(i =>
          i.text.toLowerCase().includes(searchQuery) ||
          i.tag.toLowerCase().includes(searchQuery) ||
          (i.subtasks || []).some(s => s.text.toLowerCase().includes(searchQuery))
        );
      }

      // Sort: pinned first, then by time
      filtered.sort((a, b) => {
        if (a.pinned && !b.pinned) return -1;
        if (!a.pinned && b.pinned) return 1;
        return 0; // keep original order (newest first)
      });

      // Update filter counts
      document.querySelectorAll('.filter-btn').forEach(btn => {
        const f = btn.dataset.filter;
        let count;
        if (f === 'all') count = items.filter(i => !i.done).length;
        else if (f === 'done') count = items.filter(i => i.done).length;
        else count = items.filter(i => i.tag === f && !i.done).length;
        const existing = btn.querySelector('.filter-count');
        if (existing) existing.remove();
        if (count > 0) {
          const span = document.createElement('span');
          span.className = 'filter-count';
          span.textContent = count;
          btn.appendChild(span);
        }
      });

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="empty">
          <div class="empty-icon">${searchQuery ? '?' : activeFilter === 'done' ? '~' : '.'}</div>
          <div class="empty-text">${
            searchQuery ? 'No matches found'
            : activeFilter === 'done' ? 'No completed items yet'
            : 'Nothing here yet.<br>Dump something above.'
          }</div></div>`;
        return;
      }

      // Group by day
      const groups = {};
      filtered.forEach(item => {
        const key = new Date(item.time).toISOString().split('T')[0];
        if (!groups[key]) groups[key] = [];
        groups[key].push(item);
      });

      const today = new Date().toISOString().split('T')[0];
      const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];

      let html = '';
      Object.entries(groups).forEach(([date, dayItems]) => {
        let label;
        if (date === today) label = 'Today';
        else if (date === yesterday) label = 'Yesterday';
        else label = new Date(date + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

        html += `<div class="day-group"><div class="day-label">${label}</div>`;

        dayItems.forEach(item => {
          const time = new Date(item.time).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
          const tagHtml = item.tag !== 'thought' ? `<span class="item-tag-badge ${item.tag}">${item.tag}</span>` : '';
          const pinHtml = item.pinned ? '<span class="item-pin-icon">&#9733;</span>' : '';
          const isExp = expandedItems.has(item.id);
          const overdue = !item.done && isOverdue(item.due);
          const dueHtml = item.due ? `<span class="item-due">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/></svg>
            ${formatDueShort(item.due)}</span>` : '';

          // Subtasks
          const subs = item.subtasks || [];
          const subsDone = subs.filter(s => s.done).length;
          let subtasksHtml = '';
          if (subs.length > 0 || isExp) {
            subtasksHtml += '<div class="subtasks">';
            if (subs.length > 0) {
              const pct = Math.round((subsDone / subs.length) * 100);
              subtasksHtml += `<div class="subtask-progress"><div class="subtask-progress-fill" style="width:${pct}%"></div></div>`;
            }
            subs.forEach(s => {
              subtasksHtml += `<div class="subtask ${s.done ? 'done' : ''}">
                <button class="subtask-check" onclick="toggleSubtask('${item.id}','${s.id}')">&#10003;</button>
                <span class="subtask-text">${escapeHtml(s.text)}</span>
                <button class="subtask-delete" onclick="deleteSubtask('${item.id}','${s.id}')">&times;</button>
              </div>`;
            });
            if (isExp) {
              subtasksHtml += `<div class="add-subtask">
                <input class="add-subtask-input" placeholder="Add subtask..." data-parent="${item.id}"
                  onkeydown="if(event.key==='Enter'){addSubtask('${item.id}',this.value);this.value=''}">
              </div>`;
            }
            subtasksHtml += '</div>';
          }

          // Actions row
          const actionsHtml = `<div class="item-actions ${isExp ? 'show' : ''}">
            <button class="item-action-btn" onclick="openEdit('${item.id}')">Edit</button>
            <button class="item-action-btn" onclick="togglePin('${item.id}')">${item.pinned ? 'Unpin' : 'Pin'}</button>
            <button class="item-action-btn" onclick="addSubtask('${item.id}', prompt('Subtask:') || '')">+ Subtask</button>
            <button class="item-action-btn danger" onclick="deleteItem('${item.id}')">Delete</button>
          </div>`;

          html += `<div class="item-wrap" data-wrap="${item.id}">
            <div class="swipe-bg swipe-bg-left">Done</div>
            <div class="swipe-bg swipe-bg-right">Delete</div>
            <div class="item ${item.done ? 'done' : ''} ${item.pinned ? 'pinned' : ''} ${overdue ? 'overdue' : ''}"
                 data-id="${item.id}" onclick="toggleExpand('${item.id}')">
              <button class="item-check" onclick="event.stopPropagation();toggleDone('${item.id}')">&#10003;</button>
              <div class="item-body">
                <div class="item-top-row">
                  <div class="item-text">${highlightSearch(escapeHtml(item.text))}</div>
                  ${pinHtml}
                </div>
                <div class="item-meta">
                  <span class="item-time">${time}</span>
                  ${tagHtml}
                  ${dueHtml}
                  ${subs.length ? `<span class="item-time">${subsDone}/${subs.length}</span>` : ''}
                </div>
                ${subtasksHtml}
                ${actionsHtml}
              </div>
            </div>
          </div>`;
        });
        html += '</div>';
      });

      listEl.innerHTML = html;

      // Init swipe on all items
      document.querySelectorAll('.item[data-id]').forEach(el => {
        const id = el.dataset.id;
        initSwipe(el, id);
      });

      if (statsBar.classList.contains('show')) updateStats();
    }

    function highlightSearch(html) {
      if (!searchQuery) return html;
      const regex = new RegExp(`(${searchQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
      return html.replace(regex, '<mark style="background:rgba(108,92,231,0.3);color:inherit;border-radius:2px;padding:0 2px">$1</mark>');
    }

    // ═══════════════════════════════
    //  INIT
    // ═══════════════════════════════
    renderList();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
